<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gala Folclórica 2026 - Colegio Bautista Lois Hart</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header con decoración chilena -->
      <header class="header">
        <div class="header-decoration">
          <span class="flag-decoration">�</span>
          <span class="flag-decoration">🌺</span>
          <span class="flag-decoration">🌺</span>
        </div>
        <h1 class="event-title">🎭 GALA FOLCLÓRICA 2026 🎭</h1>
        <p class="event-subtitle">Colegio Bautista Lois Hart</p>
        <p class="event-date">11 de Septiembre • 9:30 HRS</p>
        <p class="event-location">SOKOL - ANTOFAGASTA</p>
        <div class="header-decoration">
          <span class="flag-decoration">🌺</span>
          <span class="flag-decoration">🌺</span>
          <span class="flag-decoration">🌺</span>
        </div>
      </header>

      <div class="main-content">
        <!-- Área de visualización del PDF -->
        <div class="viewer-container">
          <canvas id="pdfCanvas" class="pdf-canvas"></canvas>
        </div>

        <!-- Controles de navegación -->
        <div class="controls-bottom">
          <button id="prevBtn" class="btn btn-nav" title="Página anterior">
            <span>❮</span> Anterior
          </button>

          <div class="page-info">
            <input
              type="number"
              id="pageNumber"
              min="1"
              class="page-input"
              placeholder="Página"
            />
            <span id="totalPages" class="page-total">/ 0</span>
          </div>

          <button id="nextBtn" class="btn btn-nav" title="Página siguiente">
            Siguiente <span>❯</span>
          </button>

          <button id="downloadBtn" class="btn btn-download" title="Descargar">
            ⬇️ Descargar
          </button>
        </div>

        <!-- Información de estado -->
        <div class="status-bar">
          <span id="status">Cargando documento...</span>
        </div>
      </div>

      <footer class="footer">
        <p>
          🇨🇱 Celebrando las Raíces Folclóricas de Chile • 11 de Septiembre 2026
          🇨🇱
        </p>
      </footer>
    </div>

    <!-- Cargar PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Establecer el worker de PDF.js
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>
    <script src="script.js"></script>
  </body>
</html>
